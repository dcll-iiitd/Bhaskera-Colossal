# =========================
# Model Configuration
# =========================
model:
  name: "tiiuae/falcon-7b"
  # name: "mistralai/Mistral-7B-v0.1"
  attn_impl: null  # "flash_attention_2" or null
  dtype: "float16"  # float16, bfloat16, float32

# =========================
# Dataset Configuration
# =========================
dataset:
  name: "ultrachat"  # ultrachat, redpajama, openassistant
  seq_len: 2048

# =========================
# Training Configuration
# =========================
training:
  batch_size: 2
  grad_accum: 8
  lr: 2.0e-4
  max_steps: 20

  # Distributed Training Strategy
  distributed:
    # Options: "ddp" or "fsdp"
    strategy: "fsdp"

    # DDP-specific settings (used when strategy="ddp")
    ddp:
      broadcast_buffers: false
      find_unused_parameters: false
      gradient_as_bucket_view: true

    # FSDP-specific settings (used when strategy="fsdp")
    fsdp:
      # Sharding strategy: FULL_SHARD, SHARD_GRAD_OP, NO_SHARD, HYBRID_SHARD
      sharding_strategy: "FULL_SHARD"

      # CPU offload configuration
      cpu_offload: false

      # Mixed precision settings
      mixed_precision:
        param_dtype: "float32"      # float32, float16, bfloat16
        reduce_dtype: "float32"     # float32, float16, bfloat16
        buffer_dtype: "float32"     # float32, float16, bfloat16

      # Backward prefetch: BACKWARD_PRE, BACKWARD_POST, null
      backward_prefetch: "BACKWARD_PRE"

      # Forward prefetch
      forward_prefetch: false

      # Activation checkpointing with FSDP
      activation_checkpointing: true

      # Auto wrap policy for transformer models
      auto_wrap_policy:
        # Options: "transformer_auto_wrap", "size_based_auto_wrap", null
        type: "transformer_auto_wrap"

        # For transformer_auto_wrap: specify transformer layer class names
        # These work across most transformer architectures
        transformer_layer_cls:
          - "LlamaDecoderLayer"      # For LLaMA models
          - "MistralDecoderLayer"     # For Mistral models
          - "FalconDecoderLayer"      # For Falcon models
          - "GPTNeoXLayer"            # For GPT-NeoX models
          - "GPTJBlock"               # For GPT-J models
          - "T5Block"                 # For T5 models
          - "BertLayer"               # For BERT models

        # For size_based_auto_wrap: minimum parameters per wrapped unit
        min_num_params: 1e8

      # State dict configuration
      state_dict_type: "FULL_STATE_DICT"  # FULL_STATE_DICT, SHARDED_STATE_DICT, LOCAL_STATE_DICT

# =========================
# PEFT Configuration
# =========================
peft:
  method: "qlora"  # Options: none, lora, qlora

  lora:
    r: 16
    alpha: 32
    dropout: 0.05

# =========================
# Logging Configuration
# =========================
logging:
  tracker: null  # Options: wandb, mlflow, null
  project: "bhaskera-training"
  run_name: "experiment-001"

# =========================
# Checkpointing
# =========================
checkpointing:
  enabled: true
  save_dir: "./checkpoints"
  save_interval: 100  # steps
  keep_last_n: 3
