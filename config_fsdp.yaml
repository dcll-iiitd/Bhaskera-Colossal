# =========================
# Model Configuration
# =========================
model:
  name: "tiiuae/falcon-7b"
  attn_impl: null
  dtype: "bfloat16"

# =========================
# Dataset Configuration
# =========================
dataset:
  name: "ultrachat"
  seq_len: 2048

# =========================
# Training Configuration
# =========================
training:
  batch_size: 8
  grad_accum: 8

  # LR FIX: 2e-4 was too aggressive for LoRA + FSDP on a 7B model.
  # The first gradient step at peak LR overshoots in bfloat16, causing
  # attention softmax to produce inf → NaN on all subsequent batches.
  # 5e-5 is the standard safe LR for LoRA on 7B+ models.
  lr: 5.0e-5

  max_steps: 20

  # WARMUP FIX: Linear warmup ramps LR from 0 → peak over these steps.
  # Without warmup, step 0 immediately applies the full LR, which is the
  # primary trigger for the NaN cascade in bfloat16 + FSDP training.
  warmup_steps: 5

  distributed:
    strategy: "fsdp"

    ddp:
      broadcast_buffers: false
      find_unused_parameters: false
      gradient_as_bucket_view: true

    fsdp:
      sharding_strategy: "FULL_SHARD"
      cpu_offload: false

      mixed_precision:
        param_dtype: "bfloat16"
        reduce_dtype: "bfloat16"
        buffer_dtype: "bfloat16"

      backward_prefetch: "BACKWARD_PRE"
      forward_prefetch: false
      activation_checkpointing: true

      auto_wrap_policy:
        type: "transformer_auto_wrap"
        transformer_layer_cls:
          - "LlamaDecoderLayer"
          - "MistralDecoderLayer"
          - "FalconDecoderLayer"
          - "GPTNeoXLayer"
          - "GPTJBlock"
          - "T5Block"
          - "BertLayer"
        min_num_params: 1e8

      state_dict_type: "FULL_STATE_DICT"

# =========================
# PEFT Configuration
# =========================
peft:
  method: "lora"
  lora:
    r: 16
    alpha: 32
    dropout: 0.05

# =========================
# Logging
# =========================
logging:
  tracker: "mlflow"
  project: "bhaskera-training"
  run_name: "experiment-fsdp-lora"

# =========================
# Checkpointing
# =========================
checkpointing:
  enabled: true
  save_dir: "./checkpoints"
  save_interval: 100
  keep_last_n: 3