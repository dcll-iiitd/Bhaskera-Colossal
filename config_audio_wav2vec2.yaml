# =============================================================================
# config_audio_wav2vec2.yaml  —  Wav2Vec2 CTC ASR fine-tuning via bhaskera
#
# Run with:
#   bhaskera --config config_audio_wav2vec2.yaml --num-workers 2
#
# Model family is auto-detected from model.name ("wav2vec2" in the name).
# Set model.family explicitly to override auto-detection.
# =============================================================================

# ── Launcher ──────────────────────────────────────────────────────────────────
launcher:
  backend: ray
  num_workers: 2
  max_failures: 2
  ray_results_dir: ./ray_results/audio
  run_name: null

# ── Model ─────────────────────────────────────────────────────────────────────
model:
  name: "facebook/wav2vec2-base"  # or facebook/wav2vec2-large-960h, wav2vec2-xls-r-300m
  # family: "wav2vec2"            # optional: explicit override (auto-detected here)
  language: "English"
  task: "transcribe"
  attn_impl: null
  dtype: "float16"

# ── Dataset ───────────────────────────────────────────────────────────────────
dataset:
  name: "audio"

  primary:
    name: "PolyAI/minds14"
    config: "en-US"
    split: "train[:500]"
    transcript_col: "english_transcription"
    audio_col: "audio"

  secondary:
    name: "mozilla-foundation/common_voice_11_0"
    config: "en"
    split: "train[:500]"
    transcript_col: "sentence"
    audio_col: "audio"

  sampling_rate: 16000
  test_size: 0.1
  num_proc: 4

# ── Audio ─────────────────────────────────────────────────────────────────────
audio:
  language: "English"
  task: "transcribe"

# ── Training ──────────────────────────────────────────────────────────────────
training:
  batch_size: 16
  grad_accum: 2
  lr: 1.0e-4          # Wav2Vec2 CTC typically needs higher LR than Whisper
  warmup_steps: 50
  max_steps: 400
  num_epochs: 3

  distributed:
    strategy: "ddp"
    ddp:
      find_unused_parameters: false

# ── PEFT ──────────────────────────────────────────────────────────────────────
peft:
  method: "none"       # Wav2Vec2 fine-tuning freezes CNN, trains transformer

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  tracker: null
  project: "bhaskera-audio"
  run_name: "wav2vec2-asr-ddp"

# ── Checkpointing ─────────────────────────────────────────────────────────────
checkpointing:
  enabled: true
  save_dir: "./checkpoints/audio-wav2vec2"
  save_interval: 100
  keep_last_n: 3

# ── Output ────────────────────────────────────────────────────────────────────
output:
  dir: "./wav2vec2-finetuned"
  push_to_hub: false
