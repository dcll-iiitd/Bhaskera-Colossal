# =============================================================================
# config_ray.yaml
# Bhaskera — Ray Train backend configuration
#
# Use with:
#   sbatch slurm/submit_ray.sh --config config_ray.yaml
#
# Or explicitly:
#   python -m bhaskera.launcher.main --launcher ray --config config_ray.yaml --num-workers 4
# =============================================================================

# =========================
# Launcher selection
# =========================
# This field is read by bhaskera.launcher.main to select the backend.
# --launcher flag overrides this if provided.
launcher: ray

# =========================
# Model Configuration
# =========================
model:
  name: "tiiuae/falcon-7b"
  attn_impl: null
  dtype: "bfloat16"

# =========================
# Dataset Configuration
# =========================
dataset:
  name: "ultrachat"
  seq_len: 2048

# =========================
# Training Configuration
# =========================
training:
  batch_size: 8
  grad_accum: 8
  lr: 5.0e-5
  max_steps: 500
  warmup_steps: 20
  num_epochs: 3

  distributed:
    strategy: "fsdp"

    ddp:
      broadcast_buffers: false
      find_unused_parameters: false
      gradient_as_bucket_view: true

    fsdp:
      sharding_strategy: "FULL_SHARD"
      cpu_offload: false

      mixed_precision:
        param_dtype: "bfloat16"
        reduce_dtype: "bfloat16"
        buffer_dtype: "bfloat16"

      backward_prefetch: "BACKWARD_PRE"
      forward_prefetch: false
      activation_checkpointing: true

      auto_wrap_policy:
        type: "transformer_auto_wrap"
        transformer_layer_cls:
          - "LlamaDecoderLayer"
          - "MistralDecoderLayer"
          - "FalconDecoderLayer"
          - "GPTNeoXLayer"
          - "GPTJBlock"
          - "T5Block"
          - "BertLayer"
        min_num_params: 100000000   # plain int avoids the 1e8 parse bug

      state_dict_type: "FULL_STATE_DICT"

# =========================
# PEFT Configuration
# =========================
peft:
  method: "lora"
  lora:
    r: 16
    alpha: 32
    dropout: 0.05

# =========================
# Logging
# =========================
logging:
  tracker: "mlflow"
  project: "bhaskera-ray"
  run_name: "experiment-ray-fsdp"

# =========================
# Checkpointing
# =========================
checkpointing:
  enabled: true
  save_dir: "./checkpoints"
  save_interval: 100
  keep_last_n: 3