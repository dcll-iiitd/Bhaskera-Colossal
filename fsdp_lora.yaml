# =============================================================================
# config_ray_lora_dora_pissa.yaml
# Multi-GPU Ray training with LoRA + DoRA + PiSSA on UltraChat
#
# Single node (all GPUs on one machine):
#   bhaskera --config config_ray_lora_dora_pissa.yaml
#
# Override workers at CLI:
#   bhaskera --config config_ray_lora_dora_pissa.yaml --num-workers 4
#
# On SLURM cluster via Ray-on-SLURM:
#   sbatch slurm/submit_ray.sh --config config_ray_lora_dora_pissa.yaml
# =============================================================================

# =========================
# Launcher Configuration
# =========================
launcher:
  backend: ray
  num_workers: 4          # total GPU workers (1 per GPU). auto-detected if omitted
  max_failures: 2         # Ray restarts crashed workers up to this many times
  ray_results_dir: ./ray_results
  run_name: "ray-lora-dora-pissa-ultrachat"

# =========================
# Model Configuration
# =========================
model:
  name: "tiiuae/falcon-7b"
  attn_impl: null
  dtype: "bfloat16"

# =========================
# Dataset Configuration
# =========================
dataset:
  name: "ultrachat"
  seq_len: 2048

# =========================
# Training Configuration
# =========================
training:
  # Per-GPU batch size.
  # Effective global batch = batch_size × grad_accum × world_size
  # e.g. 4 GPUs: 8 × 8 × 4 = 256 samples/step
  batch_size: 4
  grad_accum: 32

  lr: 5.0e-5
  max_steps: 500
  warmup_steps: 20
  num_epochs: 3

  distributed:
    strategy: "fsdp"

    ddp:
      broadcast_buffers: false
      find_unused_parameters: false
      gradient_as_bucket_view: true

    fsdp:
      sharding_strategy: "FULL_SHARD"
      cpu_offload: false

      mixed_precision:
        param_dtype: "bfloat16"
        reduce_dtype: "bfloat16"
        buffer_dtype: "bfloat16"

      backward_prefetch: "BACKWARD_PRE"
      forward_prefetch: false
      activation_checkpointing: true

      auto_wrap_policy:
        type: "transformer_auto_wrap"
        transformer_layer_cls:
          - "LlamaDecoderLayer"
          - "MistralDecoderLayer"
          - "FalconDecoderLayer"
          - "GPTNeoXLayer"
          - "GPTJBlock"
          - "T5Block"
          - "BertLayer"
        min_num_params: 100000000

      state_dict_type: "FULL_STATE_DICT"

# =========================
# PEFT Configuration
# LoRA + DoRA + PiSSA all active
#
# use_dora:     enables DoRA (Weight-Decomposed LoRA)
# init_weights: "pissa" — SVD-based init for better starting point
#               use "pissa_niter_16" for fast randomised SVD on large models
# =========================
peft:
  method: "lora"
  lora:
    r: 16
    alpha: 32
    dropout: 0.05


# =========================
# Logging
# =========================
logging:
  tracker: null
  project: "bhaskera-ray"
  run_name: "ray-lora-dora-pissa-ultrachat"

# =========================
# Checkpointing
# Ray Train integrates with checkpoints saved by train_loop.py.
# On worker crash + restart, training resumes from the last saved checkpoint.
# =========================
checkpointing:
  enabled: true
  save_dir: "./checkpoints"
  save_interval: 100
  keep_last_n: 3
