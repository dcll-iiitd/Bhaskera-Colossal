# =========================
# Model
# =========================
MODEL_NAME: "tiiuae/falcon-7b"
ATTN_IMPL: null   # use null instead of "None"

# =========================
# Dataset
# =========================
DATASET_NAME: "ultrachat"
SEQ_LEN: 2048

# =========================
# Training
# =========================
BATCH_SIZE: 2
GRAD_ACCUM: 8
