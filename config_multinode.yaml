# =============================================================================
# config_multinode.yaml
# Bhaskera — Multi-node FSDP training configuration
#
# Use with:
#   sbatch slurm/submit_multinode.sh --config config_multinode.yaml
# =============================================================================

# =========================
# Model Configuration
# =========================
model:
  name: "tiiuae/falcon-7b"
  attn_impl: null
  dtype: "bfloat16"

# =========================
# Dataset Configuration
# =========================
dataset:
  name: "ultrachat"
  seq_len: 2048

# =========================
# Training Configuration
# =========================
training:
  # Per-GPU batch size. Effective global batch size:
  #   batch_size × grad_accum × world_size
  # For 2 nodes × 2 GPUs = 4 processes:
  #   8 × 8 × 4 = 256 tokens/step
  batch_size: 8
  grad_accum: 8

  lr: 5.0e-5
  max_steps: 500

  # More warmup steps for multi-node (larger effective batch → more warmup)
  warmup_steps: 20

  num_epochs: 3

  distributed:
    strategy: "fsdp"

    ddp:
      broadcast_buffers: false
      find_unused_parameters: false
      gradient_as_bucket_view: true

    fsdp:
      sharding_strategy: "FULL_SHARD"

      # Multi-node note: CPU offload adds PCIe bandwidth pressure.
      # Keep false unless you're OOM.
      cpu_offload: false

      mixed_precision:
        param_dtype: "bfloat16"
        reduce_dtype: "bfloat16"
        buffer_dtype: "bfloat16"

      # BACKWARD_PRE overlaps comm with backward pass — important for multi-node
      # where inter-node bandwidth is the bottleneck.
      backward_prefetch: "BACKWARD_PRE"
      forward_prefetch: false

      # Activation checkpointing is essential on multi-node to keep per-GPU
      # memory low (each GPU only holds 1/world_size of each layer's params,
      # but activations are still per-GPU).
      activation_checkpointing: true

      auto_wrap_policy:
        type: "transformer_auto_wrap"
        transformer_layer_cls:
          - "LlamaDecoderLayer"
          - "MistralDecoderLayer"
          - "FalconDecoderLayer"
          - "GPTNeoXLayer"
          - "GPTJBlock"
          - "T5Block"
          - "BertLayer"
        min_num_params: 1e8

      state_dict_type: "FULL_STATE_DICT"

# =========================
# PEFT Configuration
# =========================
peft:
  method: "lora"
  lora:
    r: 16
    alpha: 32
    dropout: 0.05

# =========================
# Logging
# =========================
logging:
  tracker: None
  project: "bhaskera-multinode"
  run_name: "experiment-fsdp-multinode"

# =========================
# Checkpointing
# =========================
checkpointing:
  enabled: true
  save_dir: "./checkpoints"
  save_interval: 100
  keep_last_n: 3